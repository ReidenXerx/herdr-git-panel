<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Git panel for Herdr</title>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#2b2b2f" stroke="#45454d" stroke-width="8"/>
  <!-- the branch and its commit, in the accent where Quick Open has its search;
       it ends inside main's line, which is drawn over it -->
  <path d="M336 218v14a104 104 0 0 1-104 104h-40" fill="none" stroke="#9fb8e8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="336" cy="170" r="48" fill="#2b2b2f" stroke="#9fb8e8" stroke-width="36"/>
  <!-- main: two commits on a line, in the grey of Quick Open's file -->
  <path d="M176 172v168" fill="none" stroke="#b4b4bf" stroke-width="32" stroke-linecap="round"/>
  <circle cx="176" cy="132" r="44" fill="#2b2b2f" stroke="#b4b4bf" stroke-width="32"/>
  <circle cx="176" cy="380" r="44" fill="#2b2b2f" stroke="#b4b4bf" stroke-width="32"/>
</svg>
